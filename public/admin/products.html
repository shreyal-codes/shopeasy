<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products | ShopEasy Admin</title>
  <link rel="icon" href="/images/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="navbar"></header>
  <main class="container">
    <div class="page-head">
      <h1>Manage Products</h1>
      <button class="btn" id="add-product">+ Add product</button>
    </div>
    <div id="table"><p class="muted">Loading...</p></div>

    <div class="modal-bg" id="modal">
      <form class="modal" id="product-form" novalidate>
        <h2 id="modal-title">Add product</h2>
        <label for="p-name">Name</label>
        <input type="text" id="p-name">
        <label for="p-category">Category</label>
        <select id="p-category"></select>
        <label for="p-price">Price (in rupees)</label>
        <input type="number" id="p-price" min="0" step="0.01">
        <label for="p-stock">Stock</label>
        <input type="number" id="p-stock" min="0" step="1">
        <label for="p-image">Image URL</label>
        <input type="text" id="p-image" placeholder="/images/p1.svg or https://...">
        <label for="p-desc">Description</label>
        <textarea id="p-desc" rows="3"></textarea>
        <label for="p-active">Status</label>
        <select id="p-active"><option value="1">Active (visible in shop)</option><option value="0">Inactive (hidden)</option></select>
        <div id="error" class="error-msg" hidden></div>
        <div class="modal-actions">
          <button class="btn" type="submit">Save</button>
          <button class="btn btn-outline" type="button" id="cancel-modal">Cancel</button>
        </div>
      </form>
    </div>
  </main>
  <footer>ShopEasy admin panel</footer>
  <script src="/js/app.js"></script>
  <script src="/js/admin-products.js"></script>
</body>
</html>
