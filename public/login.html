<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | ShopEasy</title>
  <link rel="icon" href="/images/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="navbar"></header>
  <main class="container">
    <form id="auth-form" class="form-card" data-mode="login" novalidate>
      <h1>Login</h1>
      <label for="email">Email</label>
      <input type="email" id="email" required>
      <label for="password">Password</label>
      <input type="password" id="password" required>
      <div id="error" class="error-msg" hidden></div>
      <button class="btn btn-block" type="submit">Login</button>
      <p class="center muted" style="margin-top:14px">New here? <a href="/register.html" style="color:var(--primary)">Create an account</a></p>
    </form>
  </main>
  <footer>ShopEasy - internship project</footer>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
